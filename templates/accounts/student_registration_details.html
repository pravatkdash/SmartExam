{% extends "base.html" %}

{% block content %}
<div>
    <h1>Complete Registration</h1>

    <p>Your mobile number has been verified.</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <hr>

        <h5>Select Programs</h5>

        {{ program_form.programs }}

        {% if program_form.programs.errors %}
            <div class="text-danger">
                {{ program_form.programs.errors }}
            </div>
        {% endif %}

        <button type="submit">Create Account</button>
    </form>
</div>
{% endblock %}
