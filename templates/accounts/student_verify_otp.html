{% extends "base.html" %}

{% block content %}
<div>
    <h1>Verify Mobile Number</h1>

    <p>Enter the 4-digit OTP sent to your mobile number.</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Verify OTP</button>
    </form>
</div>
{% endblock %}
