{% extends "base.html" %}

{% block title %}
Home - SmartExam
{% endblock %}

{% block content %}

<div class="py-1">
    <div class="text-center mx-auto" style="max-width: 600px;">

        <div class="mb-3">
            <span style="font-size: 3rem;">🎓</span>
        </div>

        <h1 class="display-5 fw-bold mb-3">
            Welcome to SmartExam
        </h1>

        <p class="lead text-muted mb-5">
            Your exam journey starts here.
        </p>

        <!-- Existing Students -->
        <div class="mb-4">
            <p class="mb-3">
                Already registered? Sign in below.
            </p>

            <a href="{% url 'student_login' %}"
               class="btn btn-primary btn-lg w-100"
               style="max-width: 340px;">
                Sign in as a Student
            </a>
        </div>

        <hr class="my-4">

        <!-- New Students -->
        <div>
            <p class="mb-3">
                Not registered yet? Please register first.
            </p>

            <a href="{% url 'student_register' %}"
               class="btn btn-outline-primary btn-lg w-100"
               style="max-width: 340px;">
                Register as a Student
            </a>
        </div>

    </div>
</div>

{% endblock %}
