{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Add Chapter</h2>
            <p class="text-muted mb-0">
                {{ subject.name }}
            </p>
        </div>

        <a href="{% url 'institute_program_subject_list' program.id %}"
           class="btn btn-secondary">
            Back
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="chapter_name" class="form-label">
                        Chapter Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        id="chapter_name"
                        class="form-control"
                        placeholder="Enter chapter name"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Chapter
                </button>

            </form>

        </div>
    </div>

</div>

{% endblock %}
